name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: nix develop .#deploy --command bash -e {0}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          shell: deploy

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # アカウント ID を渡さないと、wrangler は /accounts を呼んで
          # アカウントを一覧しようとする。アカウント所有のトークンは特定の
          # アカウントに固定されているので、その一覧でつまずきうる。
          # ここで渡せば、その呼び出し自体が要らなくなる
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
