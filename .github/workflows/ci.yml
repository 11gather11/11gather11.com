name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale pull request runs, but never cancel a main run that may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit in the history, not only the checked-out tree.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Gitleaks
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml

      - name: Typos
        run: pnpm run typos

      - name: Format, lint and type check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # The deploy job ships this exact build rather than rebuilding, so what was checked is what goes live.
      - name: Upload build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # Dotfiles are not built today, but a leading-dot asset must not vanish silently from a deploy.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys run one at a time and in order, so an older build never overwrites a newer one.
    concurrency:
      group: production
      cancel-in-progress: false
    defaults:
      run:
        shell: nix develop .#deploy --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # アカウント ID を渡さないと、wrangler は /accounts を呼んで
          # アカウントを一覧しようとする。アカウント所有のトークンは特定の
          # アカウントに固定されているので、その一覧でつまずきうる。
          # ここで渡せば、その呼び出し自体が要らなくなる
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
