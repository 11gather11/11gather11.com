name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop .#ci --command bash -e {0}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit in the history, not only the checked-out tree.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Gitleaks
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml

      - name: Typos
        run: pnpm run typos

      - name: Format, lint and type check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
